<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
  /><title>Jimao</title>
  <style>
    html,
    body {
      touch-action: pan-x pan-y;
      margin: 0;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #181818;
      color: #ddd;
      font: 14px system-ui;
    }
    body {
      position: fixed;
      top: var(--jimao-viewport-top, 0px);
      left: var(--jimao-viewport-left, 0px);
      width: var(--jimao-viewport-width, 100%);
      height: var(--jimao-viewport-height, 100dvh);
      box-sizing: border-box;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
        env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      flex-wrap: nowrap;
      flex-shrink: 0;
      align-items: center;
      min-width: 0;
      gap: 8px;
      padding: 8px 12px;
      border-bottom: 1px solid #444;
    }
    select,
    button {
      font: inherit;
      font-size: 16px;
      background: #252525;
      color: #ddd;
      border: 1px solid #555;
      border-radius: 5px;
      padding: 5px;
      max-width: 65vw;
      min-width: 0;
    }
    iframe {
      border: 0;
      flex: 1;
      width: 100%;
      min-height: 0;
      display: block;
      overscroll-behavior: none;
    }
    iframe[hidden] {
      display: none;
    }
    header strong {
      flex-shrink: 0;
      white-space: nowrap;
    }
    header select {
      flex: 1 1 0;
      max-width: none;
      white-space: nowrap;
    }
    #share {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 13px;
    }
    #status {
      flex: 0 1 auto;
      min-width: 0;
      max-width: 45%;
      margin-left: auto;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: right;
      font-size: 12px;
      color: #aaa;
    }
    @media (max-width: 640px) {
      #status {
        max-width: 15%;
      }
    }
    #manual-copy {
      max-width: min(440px, calc(100vw - 40px));
      box-sizing: border-box;
      border: 1px solid #555;
      border-radius: 10px;
      background: #252525;
      color: #ddd;
    }
    #manual-copy::backdrop {
      background: #0009;
    }
    #manual-copy input {
      box-sizing: border-box;
      width: 100%;
      font-size: 16px;
      color: #ddd;
      background: #181818;
      border: 1px solid #777;
      padding: 8px;
    }
    #manual-copy button {
      margin-top: 12px;
    }
    #empty {
      min-height: 0;
      overflow: auto;
      overscroll-behavior: contain;
      overflow-wrap: anywhere;
      padding: 24px;
    }
    strong {
      font-size: 15px;
    }
  </style>
  <header>
    <strong>Jimao</strong
    ><select id="windows" aria-label="窗口 / 工作区">
      <option value="">选择 VS Code 窗口</option></select
    ><button id="share" aria-label="复制会话链接" hidden>复制会话链接</button
    ><span id="status">正在连接…</span>
  </header>
  <div id="empty">
    <span id="explanation"
      >请在需要访问的 VS Code 窗口中开启 Jimao 局域网访问。</span
    >
    <button id="retry" hidden>重试</button>
    <a id="home" href="/" hidden>返回首页</a>
  </div>
  <iframe id="view" title="Jimao 聊天" hidden></iframe>
  <dialog id="manual-copy" aria-labelledby="manual-copy-title">
    <p id="manual-copy-title">未能自动复制，请手动复制以下链接</p>
    <input id="manual-copy-url" aria-label="会话链接" readonly />
    <p>电脑上按 ⌘C 或 Ctrl+C；手机上长按链接并选择“复制”。</p>
    <form method="dialog"><button>关闭</button></form>
  </dialog>
  <script>
    // Only the outer shell follows the visual viewport. Its iframe inherits the
    // resulting size, so keyboard height and safe-area padding are applied once.
    let viewportFrame;
    function updateViewport() {
      cancelAnimationFrame(viewportFrame);
      viewportFrame = requestAnimationFrame(() => {
        const viewport = window.visualViewport;
        if (viewport && Math.abs(viewport.scale - 1) > 0.01) return;
        const root = document.documentElement.style;
        root.setProperty(
          "--jimao-viewport-height",
          `${viewport?.height || innerHeight}px`,
        );
        root.setProperty(
          "--jimao-viewport-width",
          `${viewport?.width || innerWidth}px`,
        );
        root.setProperty(
          "--jimao-viewport-top",
          `${viewport?.offsetTop || 0}px`,
        );
        root.setProperty(
          "--jimao-viewport-left",
          `${viewport?.offsetLeft || 0}px`,
        );
      });
    }
    window.visualViewport?.addEventListener("resize", updateViewport);
    window.visualViewport?.addEventListener("scroll", updateViewport);
    window.addEventListener("resize", updateViewport);
    window.addEventListener("pageshow", updateViewport);
    updateViewport();

    // Keep scrolling, but suppress browser zoom gestures on mobile.
    for (const type of ["gesturestart", "gesturechange", "gestureend"])
      document.addEventListener(type, (e) => e.preventDefault(), {
        passive: false,
      });
    document.addEventListener(
      "touchmove",
      (e) => {
        if (e.touches.length > 1) e.preventDefault();
      },
      { passive: false },
    );
    document.addEventListener("dblclick", (e) => {
      if (matchMedia("(pointer: coarse)").matches) e.preventDefault();
    });

    const select = document.querySelector("select"),
      status = document.querySelector("#status"),
      empty = document.querySelector("#empty"),
      explanation = document.querySelector("#explanation"),
      share = document.querySelector("#share"),
      retry = document.querySelector("#retry"),
      home = document.querySelector("#home");
    const compactHeader = matchMedia("(max-width: 640px)");
    function fitShareLabel() {
      share.textContent = compactHeader.matches ? "复制链接" : "复制会话链接";
    }
    compactHeader.addEventListener("change", fitShareLabel);
    fitShareLabel();
    let frame = document.querySelector("iframe"),
      selected = "",
      generation = 0;
    const sessions = new Map();
    const measure = document.createElement("canvas").getContext("2d");
    function fitWindowLabels() {
      const style = getComputedStyle(select);
      measure.font = style.font;
      const width = Math.max(
        24,
        select.clientWidth -
          parseFloat(style.paddingLeft) -
          parseFloat(style.paddingRight) -
          26,
      );
      for (const option of select.options) {
        const full = option.dataset.fullLabel || option.textContent;
        if (option.dataset.fullLabel !== full) option.dataset.fullLabel = full;
        if (option.title !== full) option.title = full;
        if (option.getAttribute("aria-label") !== full)
          option.setAttribute("aria-label", full);
        if (measure.measureText(full).width <= width) {
          if (option.textContent !== full) option.textContent = full;
        } else {
          const chars = Array.from(full);
          let low = 0,
            high = chars.length;
          while (low < high) {
            const mid = Math.ceil((low + high) / 2);
            if (
              measure.measureText("…" + chars.slice(-mid).join("")).width <=
              width
            )
              low = mid;
            else high = mid - 1;
          }
          const fitted = "…" + (low ? chars.slice(-low).join("") : "");
          if (option.textContent !== fitted) option.textContent = fitted;
        }
      }
      const title =
        select.selectedOptions[0]?.dataset.fullLabel || "选择 VS Code 窗口";
      if (select.title !== title) select.title = title;
    }
    new ResizeObserver(fitWindowLabels).observe(select);

    let resolving = false,
      initialized = false;
    let routeRevision = 0;
    const codeFromPath = () =>
      location.pathname.startsWith("/c/") ? location.pathname.slice(3) : null;
    function showError(message) {
      frame.hidden = true;
      empty.hidden = false;
      explanation.textContent = message;
      retry.hidden = home.hidden = false;
      share.hidden = true;
      status.textContent = "无法打开会话";
    }
    async function post(url, data) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify(data),
      });
      const result = await r.json();
      if (!r.ok) throw Error(result.error || "连接失败，请重试");
      return result;
    }
    function setPath(path, replace = false) {
      if (location.pathname !== path)
        history[replace ? "replaceState" : "pushState"]({}, "", path);
      share.hidden = !path.startsWith("/c/");
    }
    async function switchWindow(id, code = null) {
      const turn = ++generation;
      ++routeRevision;
      resolving = true;
      frame.hidden = true;
      frame.removeAttribute("id");
      share.hidden = true;
      empty.hidden = false;
      explanation.textContent = code ? "正在打开会话…" : "正在连接…";
      retry.hidden = home.hidden = true;
      if (!id && !code) {
        selected = "";
        select.value = "";
        sessionStorage.removeItem("jimao-window");
        resolving = false;
        explanation.textContent = "请选择 VS Code 窗口。";
        status.textContent = "未选择窗口";
        setPath("/");
        fitWindowLabels();
        return;
      }
      const cached = !code && sessions.get(id);
      if (cached) {
        selected = id;
        select.value = id;
        sessionStorage.setItem("jimao-window", id);
        frame = cached.frame;
        frame.id = "view";
        frame.hidden = false;
        empty.hidden = true;
        status.textContent = "已连接";
        setPath(cached.path || "/");
        resolving = false;
        fitWindowLabels();
        return;
      }
      status.textContent = "正在连接…";
      try {
        const data = await post("/connect", code ? { code } : { windowId: id });
        if (turn !== generation) {
          fetch("/disconnect/" + data.id, { method: "POST" }).catch(() => {});
          return;
        }
        id = data.windowId;
        // An explicit URL always creates a fresh initialized client, never navigates a cached page.
        const previous = sessions.get(id);
        if (previous) {
          previous.frame.remove();
          fetch("/disconnect/" + previous.client, { method: "POST" }).catch(
            () => {},
          );
        }
        selected = id;
        select.value = id;
        sessionStorage.setItem("jimao-window", id);
        fitWindowLabels();
        frame = document.createElement("iframe");
        frame.title = "Jimao 聊天";
        frame.id = "view";
        document.body.append(frame);
        const path = code ? "/c/" + code : "/";
        sessions.set(id, {
          client: data.id,
          frame,
          path,
          fallback: data.fallback,
        });
        if (!code) setPath("/");
        share.hidden = !code;
        frame.src = "/frame/" + data.id;
        empty.hidden = true;
      } catch (e) {
        if (turn === generation) showError(e.message);
      } finally {
        if (turn === generation) resolving = false;
      }
    }
    async function openAddress() {
      const code = codeFromPath();
      if (code !== null) return switchWindow("", code);
      // Browser Back to / means home, not the previously cached conversation.
      for (const session of sessions.values()) {
        session.frame.remove();
        fetch("/disconnect/" + session.client, { method: "POST" }).catch(
          () => {},
        );
      }
      sessions.clear();
      if (selected) sessionStorage.setItem("jimao-route-" + selected, "/");
      await switchWindow(select.value || selected);
    }
    let windowListSignature = "";
    async function refresh() {
      try {
        const r = await fetch("/windows"),
          list = await r.json();
        // Restore a saved window only on entry, never over an explicit clear.
        const chosen =
          selected ||
          (!initialized && sessionStorage.getItem("jimao-window")) ||
          "";
        const signature = JSON.stringify(
          list.map(({ id, name, folders }) => ({ id, name, folders })),
        );
        if (signature !== windowListSignature) {
          windowListSignature = signature;
          select.replaceChildren(
            new Option("选择 VS Code 窗口", ""),
            ...list.map(
              (w) =>
                new Option(
                  w.name +
                    (w.folders.length ? " — " + w.folders.join(", ") : ""),
                  w.id,
                ),
            ),
          );
        }
        const value = list.some((w) => w.id === chosen) ? chosen : "";
        if (select.value !== value) select.value = value;
        fitWindowLabels();
        for (const [id, session] of sessions)
          if (!list.some((w) => w.id === id)) {
            session.frame.remove();
            sessions.delete(id);
          }
        if (!initialized) {
          initialized = true;
          if (codeFromPath() !== null) await openAddress();
          else if (select.value) await switchWindow(select.value);
          else status.textContent = list.length + " 个窗口在线";
        } else if (
          selected &&
          !list.some((w) => w.id === selected) &&
          !resolving
        ) {
          selected = "";
          if (codeFromPath() !== null) await openAddress();
          else showError("窗口已断开，请重新选择。");
        }
      } catch {
        status.textContent = "服务已断开，正在重连…";
      }
    }
    select.onchange = () => {
      setPath("/");
      switchWindow(select.value);
    };
    retry.onclick = () =>
      codeFromPath() !== null ? openAddress() : switchWindow(select.value);
    window.addEventListener("popstate", openAddress);
    function copyWithSelection(text) {
      const active = document.activeElement;
      const selection = window.getSelection();
      const ranges = selection
        ? Array.from({ length: selection.rangeCount }, (_, i) =>
            selection.getRangeAt(i).cloneRange(),
          )
        : [];
      const field = document.createElement("textarea");
      field.value = text;
      field.readOnly = true;
      field.style.cssText =
        "position:fixed;top:0;left:0;width:1px;height:1px;opacity:0;font-size:16px";
      document.body.append(field);
      try {
        field.focus({ preventScroll: true });
        field.select();
        field.setSelectionRange(0, text.length);
        return document.execCommand("copy");
      } catch {
        return false;
      } finally {
        field.remove();
        active?.focus({ preventScroll: true });
        if (selection) {
          selection.removeAllRanges();
          for (const range of ranges) selection.addRange(range);
        }
      }
    }
    share.onclick = async () => {
      const url = location.origin + location.pathname;
      share.disabled = true;
      try {
        let copied = false;
        if (navigator.clipboard?.writeText) {
          try {
            await navigator.clipboard.writeText(url);
            copied = true;
          } catch {}
        }
        if (!copied) copied = copyWithSelection(url);
        if (copied) status.textContent = "会话链接已复制";
        else {
          status.textContent = "未能自动复制，请手动复制";
          const dialog = document.querySelector("#manual-copy");
          const field = document.querySelector("#manual-copy-url");
          field.value = url;
          dialog.showModal();
          field.focus({ preventScroll: true });
          field.select();
        }
      } finally {
        share.disabled = false;
      }
    };
    window.addEventListener("message", async (e) => {
      if (e.origin !== location.origin) return;
      const id = e.data?.windowId,
        session = sessions.get(id);
      if (e.data?.type === "jimao-route") {
        if (
          !session ||
          e.source !== session.frame.contentWindow ||
          e.data.clientId !== session.client
        )
          return;
        const route = e.data.route;
        if (id !== selected) return;
        const revision = ++routeRevision,
          turn = generation;
        if (route === "/") {
          session.path = "/";
          setPath("/");
          return;
        }
        const target = new URL(route, location.origin);
        const match = /^\/local\/([a-zA-Z0-9_-]{1,128})$/.exec(target.pathname);
        if (
          !match ||
          ![null, "local"].includes(target.searchParams.get("hostId"))
        ) {
          session.path = "/";
          setPath("/");
          status.textContent = "此会话来源暂不支持分享链接";
          return;
        }
        share.hidden = true;
        // The route can be published just before a new thread is durably saved.
        for (let attempt = 0; attempt < 3; attempt++) {
          try {
            const data = await post("/links", {
              clientId: session.client,
              threadId: match[1],
            });
            if (
              revision !== routeRevision ||
              turn !== generation ||
              sessions.get(id) !== session
            )
              return;
            session.path = data.path;
            setPath(data.path);
            if (/此会话来源|会话链接暂不可用/.test(status.textContent))
              status.textContent = session.fallback
                ? "原窗口已关闭，已通过可用工作区打开"
                : "已连接";
            return;
          } catch (error) {
            if (revision !== routeRevision || turn !== generation) return;
            if (attempt === 2) {
              share.hidden = true;
              status.textContent = "会话链接暂不可用：" + error.message;
            } else await new Promise((r) => setTimeout(r, 500));
          }
        }
        return;
      }
      if (e.data?.type === "jimao-reconnect") {
        if (!session || e.source !== session.frame.contentWindow) return;
        sessions.delete(id);
        session.frame.remove();
        fetch("/disconnect/" + session.client, { method: "POST" }).catch(
          () => {},
        );
        if (selected === id && !resolving) {
          const code = codeFromPath();
          await switchWindow(id, code);
        }
        return;
      }
      if (e.data?.type === "jimao-connection") {
        const current = sessions.get(selected);
        if (
          !current ||
          current.frame !== frame ||
          frame.hidden ||
          resolving ||
          e.source !== current.frame.contentWindow
        )
          return;
        status.textContent =
          current?.fallback && e.data.status === "已连接"
            ? "原窗口已关闭，已通过可用工作区打开"
            : e.data.status;
      }
    });
    // A hidden page may return from BFCache or mobile suspension. Retain its
    // transport session; the gateway bounds abandoned sessions by time and bytes.
    refresh();
    setInterval(refresh, 3000);
  </script>
</html>
